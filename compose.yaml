name: cv

services:
  app:
    build:
      context: .
    image: cv-builder:latest
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.cv.rule=Host(`${APP_HOST:?APP_HOST is required}`)
      - traefik.http.routers.cv.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.cv.tls=true
      - traefik.http.routers.cv.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.cv.loadbalancer.server.port=80

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
